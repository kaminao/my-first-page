<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Pages のテスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #eef4ff;
      color: #20304a;
    }

    main {
      width: 100%;
      max-width: 640px;
      padding: 40px 28px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 40px #20304a15;
    }

    .label {
      color: #2563eb;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(26px, 5vw, 36px);
      line-height: 1.4;
    }

    p {
      line-height: 1.8;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      min-height: 3.6em;
      color: #2563eb;
      font-weight: bold;
    }

    footer {
      margin-top: 24px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">MY FIRST WEBSITE</p>

    <h1>GitHub Pages テスト２</h1>

    <p>
      テストページです。<br>
    </p>

    <button id="helloButton" type="button">押してみる</button>
    <p id="message" aria-live="polite">
      ボタンを押すと、ここにメッセージが表示されます。
    </p>

    <footer>Created with GitHub Pages</footer>
  </main>

  <script>
    let count = 0;

    document.getElementById("helloButton")
      .addEventListener("click", function () {
        count += 1;
        document.getElementById("message").textContent =
          "動作成功！ ボタンを " + count + " 回押しました。";
      });
  </script>
</body>
</html>
